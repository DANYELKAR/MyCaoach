spring:
  application:
    name: mycoach-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/spark}
    username: ${DATABASE_USERNAME:spark}
    password: ${DATABASE_PASSWORD:spark_local_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spark:
  ai:
    enabled: ${AI_ENABLED:true}
  billing:
    enabled: ${BILLING_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
