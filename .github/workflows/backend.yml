name: Backend
on:
  push:
    paths: ["backend/**", "compose*.yaml", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "compose*.yaml", "scripts/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B --no-transfer-progress fmt:check verify
        working-directory: backend
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 90
      - run: python3 scripts/smoke_backend.py
      - if: always()
        run: docker compose down
